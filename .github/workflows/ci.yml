name: Convino CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran cmake git wget
          # Try ROOT from apt
          sudo apt-get install -y root-system-bin root-system-common root-system-dev || true
          # Fallback if apt fails
          if ! command -v root-config &> /dev/null; then
            echo "ROOT not found via apt, installing via conda..."
            sudo apt-get install -y python3 python3-pip
            pip install conda
            conda install -y -c conda-forge root
          fi

      - name: Build Convino
        run: |
          make -j$(nproc)
          ls -l ./convino || echo "Convino binary not found!"

      - name: Run tests
        run: |
          chmod +x test/run_tests.sh
          ./test/run_tests.sh
